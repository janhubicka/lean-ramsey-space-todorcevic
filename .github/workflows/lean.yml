name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners are ephemeral. Cache the pinned Lean toolchain so
      # elan does not download and unpack it on every CI run.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      # Keep dependency checkouts and compiled project artifacts between runs.
      # Each commit gets a new cache, restored from the most recent compatible
      # predecessor when there is no exact hit.
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit abstract Ramsey theorem axioms
        run: |
          set -o pipefail
          mkdir -p proof-audit
          lake env lean scripts/CheckAbstractRamsey.lean 2>&1 | tee proof-audit/abstract-ramsey-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('proof-audit/abstract-ramsey-axioms.log').read_text()
          entries = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text, re.S)
          if len(entries) != 8:
              raise SystemExit(f'Expected 8 abstract Ramsey axiom reports, received {len(entries)}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in entries:
              found = {x.strip() for x in entry.split(',') if x.strip()}
              if found - allowed:
                  raise SystemExit(f'Unexpected proof axioms: {found - allowed}')
          if 'sorryAx' in text or re.search(r'\berror:', text):
              raise SystemExit('Abstract Ramsey proof audit contains an error or an admitted proof')
          print('PASS: abstract Ramsey and diagonal Ellentuck proofs use only standard Lean axioms')
          PY
