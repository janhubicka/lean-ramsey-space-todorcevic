name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: |
          mkdir -p proof-audit
          if ! lake build > proof-audit/build.log 2>&1; then
            cat proof-audit/build.log
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proof-audit/build.log").read_text(encoding="utf-8")
          warnings = sum("warning:" in line for line in text.splitlines())
          hints = sum("Hint:" in line for line in text.splitlines())
          print(f"PASS: full build ({warnings} warning lines, {hints} hints; full log in artifact)")
          PY

      - name: Audit first-application interfaces and theorem axioms
        run: |
          if ! lake env lean scripts/CheckFirstApplication.lean > proof-audit/first-application.log 2>&1; then
            cat proof-audit/first-application.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/first-application.log 5 || {
            cat proof-audit/first-application.log
            exit 1
          }

      - name: Audit the published Abstract Ellentuck interface
        run: |
          if ! lake env lean scripts/CheckPublishedEllentuck.lean > proof-audit/published-ellentuck.log 2>&1; then
            cat proof-audit/published-ellentuck.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/published-ellentuck.log 7 || {
            cat proof-audit/published-ellentuck.log
            exit 1
          }
          echo "PASS: published A.3(2), Tychonoff closedness, Theorem 5.4, and diagonal derivation typecheck"

      - name: Audit the full Abstract Ramsey dependencies
        run: |
          if ! lake env lean scripts/CheckAbstractRamsey.lean > proof-audit/abstract-ramsey-axioms.log 2>&1; then
            cat proof-audit/abstract-ramsey-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/abstract-ramsey-axioms.log 10 || {
            cat proof-audit/abstract-ramsey-axioms.log
            exit 1
          }

      - name: Record the exact audited sources
        if: always()
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD > proof-audit/COMMIT
          cp lean-toolchain lakefile.toml proof-audit/
          git diff 52538d2c3aae3b66bc986bb69a9a7a52e7ea0116 HEAD -- \
            RamseySpace RamseySpace.lean scripts README.md docs .github/workflows/lean.yml \
            > proof-audit/abstract-ramsey-audit.patch
          git archive --format=tar.gz -o proof-audit/source.tar.gz HEAD

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abstract-ramsey-audit
          path: proof-audit/
          retention-days: 30
